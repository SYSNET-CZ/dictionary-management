name: CI — Docker Build & Push

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE_NAME: sysnetcz/dictionaries

jobs:
  build:
    name: Build and push
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAJOR_MINOR="${VERSION%.*}"
            TAGS="${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:${MAJOR_MINOR},${{ env.IMAGE_NAME }}:latest"
            echo "push=true" >> $GITHUB_OUTPUT
          else
            TAGS="${{ env.IMAGE_NAME }}:dev-${GITHUB_SHA::8}"
            echo "push=false" >> $GITHUB_OUTPUT
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}, Tags: ${TAGS}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            DICT_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## dictionary-management" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.version.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
