name: CI — Test & Docker Build & Push

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE_NAME: sysnetcz/dictionaries

jobs:
  test:
    name: Tests
    runs-on: self-hosted

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017/tcp
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: test
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Run tests
        env:
          MONGO_PORT: ${{ job.services.mongo.ports['27017'] }}
          MONGO_HOST: localhost
          MONGO_USERNAME: root
          MONGO_PASSWORD: test
          MONGO_DATABASE: dictionaries_test
        run: |
          python -m pytest tests/ -q --tb=short --ignore=tests/integration

  build:
    name: Build and push
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAJOR_MINOR="${VERSION%.*}"
            TAGS="${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:${MAJOR_MINOR},${{ env.IMAGE_NAME }}:latest"
            echo "push=true" >> $GITHUB_OUTPUT
          else
            TAGS="${{ env.IMAGE_NAME }}:dev-${GITHUB_SHA::8}"
            echo "push=false" >> $GITHUB_OUTPUT
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}, Tags: ${TAGS}"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            DICT_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## dictionary-management" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.version.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
